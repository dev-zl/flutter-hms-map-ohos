group 'com.huawei.hms.flutter.map'
version '1.0'

repositories {
    google()
    mavenCentral()
    maven { url 'https://developer.huawei.com/repo/' }
}

apply plugin: 'com.android.library'

android {
    namespace "com.huawei.hms.flutter.map"
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 20
        targetSdkVersion 34
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.huawei.hms:maps:6.11.2.301'
    implementation 'com.huawei.hms:maps-basic:6.11.2.301'
    // HMS Core resources include an AppCompat-based theme and its color attributes.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.interpolator:interpolator:1.0.0'
}
